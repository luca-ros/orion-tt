# Nome dell'applicazione (generato da IntelliJ)
spring.application.name=orion-tt

# ===== Connessione a MySQL (XAMPP) =====
# URL: host localhost, porta 3306 (default MySQL), database orion_tt
spring.datasource.url=jdbc:mysql://localhost:3306/orion_tt
# Utente di default di XAMPP
spring.datasource.username=root
# XAMPP di default non ha password per root: lascia vuoto
spring.datasource.password=

# ===== JPA / Hibernate =====
# update = Hibernate crea/aggiorna le tabelle leggendo le @Entity
# (non cancella mai i dati che inserisci a mano)
spring.jpa.hibernate.ddl-auto=update
# Mostra in console le query SQL che Hibernate esegue:
# utile per vedere la SELECT quando chiami la GET
spring.jpa.show-sql=true